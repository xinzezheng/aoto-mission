name: 土豆雷
 
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 土豆雷
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 配置 JDK 17 (Setup Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Gradle 缓存 (Setup Gradle Cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 准备密钥与环境文件 (Prepare Keystores and Environment)
        run: |
          # 1. 恢复或生成 debug.keystore，确保 debugConfig 签名可用
          if [ -f "debug.keystore.base64" ]; then
            echo "正在从 base64 恢复 debug.keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "生成新的 debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. 生成发布版签名密钥库 my-upload-key.jks，确保 assembleRelease 签名可用
          if [ ! -f "my-upload-key.jks" ]; then
            echo "生成发布版签名库 my-upload-key.jks..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=AutoFlow, OU=App, O=AutoFlow, L=City, ST=State, C=CN"
          fi

          # 3. 验证 google-services.json 是否存在
          if [ ! -f "app/google-services.json" ]; then
            echo "生成备用 google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "autoflow-app",
              "storage_bucket": "autoflow-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.autoflow.kpqxvw"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_client_api_key_placeholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: 赋予 Gradle 执行权限 (Grant Execute Permission)
        run: chmod +x gradlew || true

      - name: 编译完整独立 APK (Assemble Standalone APK)
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          echo "开始执行 Gradle 构建..."
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 查找编译生成的 APK (Locate Generated APK)
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | sort | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "未找到 APK 文件，退出..."
            exit 1
          fi
          echo "成功找到 APK 文件路径: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 整理发布产物 (Prepare Final Integrated APK)
        run: |
          mkdir -p release_output
          cp ${{ steps.find_apk.outputs.apk_path }} release_output/app-release.apk

      - name: 发布产物至 GitHub Releases (Publish to GitHub Releases)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          name: "土豆雷"
          body: ""
          generate_release_notes: false
          draft: false
          prerelease: false
          files: release_output/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理 GitHub Release 说明内容 (Clear Release Description)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name == 'main' && 'latest' || github.ref_name }}"
          gh release edit "$TAG_NAME" --title "土豆雷" --notes "" || true

      - name: 自动同步发布至 Gitee 发行版 (Sync to Gitee Releases)
        if: env.GITEE_TOKEN != '' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          echo "检测到已配置 GITEE_TOKEN，开始同步至 Gitee 发行版..."
          TAG_NAME="${{ github.ref_name == 'main' && 'latest' || github.ref_name }}"
          RELEASE_RESP=$(curl -s -X POST "https://gitee.com/api/v5/repos/xinze0408/aoto-mission/releases" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"$GITEE_TOKEN\",\"tag_name\":\"$TAG_NAME\",\"name\":\"土豆雷\",\"body\":\"\"}")
          RELEASE_ID=$(echo "$RELEASE_RESP" | grep -o '"id":[0-9]*' | head -n 1 | cut -d':' -f2)
          
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s "https://gitee.com/api/v5/repos/xinze0408/aoto-mission/releases/tags/$TAG_NAME?access_token=$GITEE_TOKEN" | grep -o '"id":[0-9]*' | head -n 1 | cut -d':' -f2)
          fi

          if [ -n "$RELEASE_ID" ]; then
            curl -s -X PATCH "https://gitee.com/api/v5/repos/xinze0408/aoto-mission/releases/$RELEASE_ID" \
              -H "Content-Type: application/json" \
              -d "{\"access_token\":\"$GITEE_TOKEN\",\"tag_name\":\"$TAG_NAME\",\"name\":\"土豆雷\",\"body\":\"\"}"
            echo "正在上传 app-release.apk 到 Gitee Release $RELEASE_ID..."
            curl -s -X POST "https://gitee.com/api/v5/repos/xinze0408/aoto-mission/releases/$RELEASE_ID/attach_files" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@release_output/app-release.apk"
            echo "Gitee 发行版上传完成！"
          fi
