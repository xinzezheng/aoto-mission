name: 自动编译并发布 APK (Automated APK Build & Release)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: 编译完整独立 APK 并上传至 GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 配置 JDK 17 (Setup Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Gradle 缓存 (Setup Gradle Cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 赋予 Gradle 执行权限 (Grant Execute Permission)
        run: chmod +x gradlew || true

      - name: 编译发布版 APK (Assemble Release APK)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: 查找编译生成的 APK (Locate Generated APK)
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "未找到 APK 文件，尝试强制打包..."
            gradle assembleRelease --no-daemon || true
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "APK 文件路径: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 复制完整独立 APK 产物 (Prepare Final Integrated APK)
        run: |
          mkdir -p release_output
          cp ${{ steps.find_apk.outputs.apk_path }} release_output/app-release.apk

      - name: 创建 GitHub Release 并发布产物 (Publish to GitHub Releases)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          name: "AutoFlow 最新稳定版产物 (${{ github.ref_name }})"
          body: |
            ## 🚀 自动编译整合好的独立 APK 软件
            - 软件版本: ${{ github.ref_name }}
            - 包含完整的运行时与配置数据，可直接在手机上独立安装运行。
            - 中国大陆用户支持通过镜像加速无 VPN 直连一键下载更新。
          draft: false
          prerelease: false
          files: release_output/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
